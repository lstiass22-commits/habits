<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habits">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="theme-color" content="#090d0f">
<title>Habits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: eine Spalte wie auf dem iPhone. Tagesring mit Skala oben, Coach-Karte, Wochenleiste, gruppierte Liste, schwebende Tab-Leiste.
   Farben tragen Bedeutung: Blau = läuft noch, Grün = geschafft, Gelb/Rot = Tage mit wenig Ertrag. */
:root{
  --bg-top:#1e2a30;
  --bg-bot:#090d0f;
  --card-a:rgba(255,255,255,.07);
  --card-b:rgba(255,255,255,.032);
  --hair:rgba(255,255,255,.075);
  --text:#f3f7f9;
  --muted:#8aa1ad;
  --faint:#5c717c;
  --blue:#0093e7;
  --teal:#00f19f;   /* WHOOP Teal: Buttons, Akzente */
  --green:#16ec06;  /* WHOOP High Recovery */
  --amber:#ffde00;
  --red:#ff0026;
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html{background:#090d0f}
html,body{overscroll-behavior-y:contain}
html,body{height:100%}
body{color:var(--text);font:400 16px/1.4 var(--font-body);-webkit-font-smoothing:antialiased;background:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 60% at 50% 0%,#24343b 0%,rgba(30,42,48,0) 70%),linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bot) 75%)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:0 20px 120px;transition:transform .5s cubic-bezier(.22,1,.36,1)}
#app.pulling{transition:none}
.label{font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.card{background:linear-gradient(180deg,var(--card-a),var(--card-b));border:1px solid var(--hair);border-radius:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:30px 0 4px}
.eyebrow{margin-bottom:6px}
h1{font:700 clamp(26px,7.6vw,38px)/1 var(--font-display);text-transform:uppercase;letter-spacing:.02em}
.top-actions{display:flex;gap:7px;flex:none;align-items:center}
.top-actions .ghost:not(.emoji){padding:0 12px;height:34px;font-size:12.5px}
.ghost{background:rgba(255,255,255,.04);border:1px solid var(--hair);color:var(--text);padding:8px 15px;border-radius:999px;font-size:13px;font-weight:600;letter-spacing:.02em}
.ghost:hover{background:rgba(255,255,255,.09)}
.ghost[hidden]{display:none}
.ghost.emoji{width:40px;height:40px;padding:0;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.ghost.emoji svg{display:block}
.ghost.emoji[hidden]{display:none}
.dstreak{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.04);border:1px solid var(--hair);color:var(--faint);flex:none}
.dstreak[hidden]{display:none}
.dstreak svg{display:block;fill:none;stroke:currentColor}
.dstreak b{position:absolute;right:-3px;bottom:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#0b0f12;border:1px solid var(--hair);color:var(--muted);font:700 10px/14px var(--font-display);text-align:center;font-variant-numeric:tabular-nums}
.dstreak.pend{color:var(--muted)}
.dstreak.on{color:#fff}
.dstreak.on svg{fill:currentColor}
.dstreak.on b{background:#fff;border-color:#fff;color:#000}
.top-l{display:flex;align-items:center;gap:11px;min-width:0;flex:1}
.top-l>div{min-width:0}
.top-l .eyebrow,.top-l h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{flex:none;width:40px;height:40px;border-radius:50%;padding:0;background:#161617;border:1px solid rgba(255,255,255,.14);box-shadow:0 4px 14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06);display:grid;place-items:center;overflow:hidden;transition:transform .15s,border-color .2s}
.brand:active{transform:scale(.92)}
.brand:hover{border-color:rgba(255,255,255,.3)}
.brand:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.brand svg{width:100%;height:100%;display:block}
.drawer{position:fixed;inset:0;z-index:25}
.drawer[hidden]{display:none}
.drawer-bg{position:absolute;inset:0;background:rgba(3,6,8,.62);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;transition:opacity .3s}
.drawer.open .drawer-bg{opacity:1}
.drawer-panel{position:absolute;left:0;top:0;bottom:0;width:min(84vw,340px);background:linear-gradient(180deg,#1b262c,#12191d);border-right:1px solid var(--hair);border-radius:0 28px 28px 0;padding:26px 20px 24px;transform:translateX(-104%);transition:transform .4s cubic-bezier(.22,1,.36,1);touch-action:pan-y;box-shadow:12px 0 40px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:22px;overflow-y:auto}
.drawer.open .drawer-panel{transform:none}
.drawer-panel.dragging{transition:none}
.dr-head{display:flex;align-items:center;gap:13px}
.dr-head h2{flex:1;font:700 26px/1 var(--font-display);text-transform:uppercase;letter-spacing:.03em}
.dr-nav{display:grid;gap:2px;margin:-4px -20px 0}
.dr-item{display:flex;align-items:center;gap:12px;width:100%;height:50px;padding:0 20px;text-align:left;border:0;border-radius:0;background:none;color:var(--muted);font-size:15.5px;font-weight:600;position:relative;transition:background .15s,color .15s}
.dr-item svg{flex:none}
.dr-item:hover{background:rgba(255,255,255,.05)}
.dr-item:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.dr-item[aria-current="page"]{background:rgba(255,255,255,.08);color:var(--text)}
.dr-item[aria-current="page"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#4a575f}
.soon{padding:34px 22px;text-align:center;display:grid;gap:12px;justify-items:center;margin-top:26px}
.soon .ci2{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--muted)}
.soon p{color:var(--muted);font-size:14.5px;line-height:1.5}
@media (prefers-reduced-motion:reduce){.drawer-panel,.drawer-bg{transition:none}}

/* Ringe */
.ring{display:block;overflow:visible}
.ring .track{fill:none;stroke:rgba(255,255,255,.075)}
.ring .bar{fill:none;stroke-linecap:round}

/* Hero */
.hero{display:grid;place-items:center;padding:22px 0 8px}
.hero-wrap{position:relative;width:min(264px,74vw);aspect-ratio:1}
.hero-wrap svg{position:relative;width:100%;height:100%}
.hero-wrap.pulse svg{animation:pulse 1.4s ease-out forwards}
.tick{stroke:rgba(255,255,255,.13);stroke-width:1.5;stroke-linecap:round}
.tick.on{stroke:var(--hc)}
.mark{stroke:#fff;stroke-width:3;stroke-linecap:round;opacity:.9}
.hero-mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:3px;background:none;border:0;border-radius:50%}
.hero-pct{font:400 72px/.9 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hero-pct small{font-size:15px;font-weight:500;color:var(--muted);margin-left:2px;letter-spacing:0}
.hero-mid .label{font-size:10px;letter-spacing:.1em}
.hero-sub{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Coach + Tagesverlauf */
.coach{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;margin-top:14px}
.coach-ic{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--text)}
.coach-txt{font-size:15px;line-height:1.4;margin-top:4px}
.coach-txt b{font-weight:600}
.pace{display:flex;align-items:center;gap:12px;margin:14px 4px 0}
.pace-bar{position:relative;flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.08)}
.pace-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--pc,var(--blue))}
.pace-bar b{position:absolute;top:-4px;width:2px;height:12px;border-radius:1px;background:var(--text);transform:translateX(-1px)}
.pace-val{font:600 13px var(--font-display);letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums}

/* Wochenleiste */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:22px 0 26px}
.day{background:none;border:0;border-radius:16px;padding:9px 0 8px;display:grid;justify-items:center;gap:7px;color:var(--muted)}
.day.sel{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px var(--hair)}
.day.today .dn{color:var(--text)}
.day:disabled{opacity:.28;cursor:default}
.dn{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.mini{position:relative;width:38px;height:38px}
.mini .num{position:absolute;inset:0;display:grid;place-items:center;font:600 14px var(--font-display);color:var(--text);font-variant-numeric:tabular-nums}

/* Liste */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 10px}
.sec span.r{font-size:12px;color:var(--faint)}
.group{list-style:none;padding:0;overflow:hidden}
.row{display:flex;align-items:center;padding-right:18px;position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.row.arming::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--teal);transform-origin:left;animation:arm 1.2s linear .3s both}
@keyframes arm{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.row.shifty,.row.settling{transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.row.lifting{z-index:5;background:#1d2a31;border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.14);will-change:transform}
.group.reordering{overflow:visible}
.group.reordering .row-main{pointer-events:none}
.row + .row{border-top:1px solid var(--hair)}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:13px 12px 13px 16px;background:none;border:0;text-align:left}
.row-main:disabled{cursor:default}
.row-main:active:not(:disabled){background:rgba(255,255,255,.03)}
.chk{position:relative;width:40px;height:40px;flex:none;border-radius:50%}
.chk svg.ring{position:absolute;inset:0}
.chk .mid{position:absolute;inset:0;display:grid;place-items:center;font:600 17px var(--font-display);font-variant-numeric:tabular-nums}
.chk.done{background:var(--green)}
.chk.done .mid{color:#03150e}
.chk.pop{animation:pop .38s cubic-bezier(.3,1.4,.5,1)}
.txt{min-width:0}
.name{font-weight:500;font-size:16px;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.streak{text-align:right;line-height:1;flex:none;min-width:44px}
.streak b{display:block;font:700 26px/1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--text)}
.streak b.lo{color:var(--muted)}
.streak b.hi{color:var(--green)}
.streak b.zero{color:var(--faint);font-weight:500}
.streak i{display:block;margin-top:4px;font-style:normal;font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.del{width:38px;height:38px;border-radius:50%;border:1px solid var(--hair);background:none;display:grid;place-items:center;color:var(--muted)}
.del:hover{color:var(--red);border-color:var(--red)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.add{margin-top:12px;width:100%;padding:15px;border-radius:20px;background:none;border:1px dashed rgba(255,255,255,.14);color:var(--muted);font-size:14px;font-weight:600;letter-spacing:.02em}
.add:hover{color:var(--text);border-color:rgba(255,255,255,.3)}

/* Verlauf */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 14px}
.tile{padding:16px 10px 14px;text-align:center}
.tile b{display:block;font:700 40px/1 var(--font-display);font-variant-numeric:tabular-nums}
.tile b small{font-size:17px;font-weight:600;color:var(--muted);margin-left:2px}
.tile .label{display:block;margin-top:8px;font-size:10px;letter-spacing:.12em}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 4px 24px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.line{width:14px;height:2px;border-radius:1px;background:rgba(255,255,255,.7)}
.panel{padding:16px 16px 14px;margin-bottom:24px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel-head span.r{font-size:12px;color:var(--faint)}
.chartwrap{position:relative;margin-top:34px}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:rgba(255,255,255,.07);stroke-width:1}
.chart .axis{fill:var(--faint);font:500 9.5px var(--font-body)}
.chart .axis.today{fill:var(--text)}
.chart .val{fill:var(--text);font:600 11px var(--font-display);letter-spacing:.04em}
.chart .tgt{stroke:rgba(255,255,255,.7);stroke-width:1.5}
.chart .hit{fill:transparent;outline:none}
.chart .hit:hover,.chart .hit:focus-visible{fill:rgba(255,255,255,.07)}
.tip{position:absolute;top:-8px;transform:translate(-50%,-100%);pointer-events:none;background:#0d1417;border:1px solid var(--hair);border-radius:12px;padding:7px 11px;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.45);z-index:2}
.tip[hidden]{display:none}
.tip b{display:block;font:700 18px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.tip span{display:block;font-size:11.5px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.cal .wd{text-align:center;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding-bottom:2px}
.cell{--zc:var(--muted);aspect-ratio:1;border-radius:12px;display:grid;place-items:center;padding:0;appearance:none;cursor:pointer;transition:transform .12s,filter .12s;font:600 14px var(--font-display);font-variant-numeric:tabular-nums;color:rgba(243,247,249,.85);background:color-mix(in srgb,var(--zc) 15%,transparent);border:1px solid color-mix(in srgb,var(--zc) 30%,transparent)}
.cell.z-green{--zc:var(--green)}
.cell.z-amber{--zc:var(--amber)}
.cell.z-red{--zc:var(--red)}
.cell.z-blue{--zc:var(--blue)}
.cell.z-rest{--zc:#6f8089}
.cell.perfect{background:var(--zc);border-color:var(--zc);color:#03150e}
.cell.future{background:none;border:1px dashed rgba(255,255,255,.08);color:var(--faint);cursor:default}
.cell.now{box-shadow:0 0 0 2px var(--bg-bot),0 0 0 3.5px var(--text)}
.cell:not(.future):hover{transform:translateY(-2px) scale(1.06);filter:brightness(1.25)}
.cell:not(.future):active{transform:scale(.96)}
.hrow{padding:14px 18px;display:grid;gap:10px}
.hrow + .hrow{border-top:1px solid var(--hair)}
.hrow-top,.hrow-bot{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hrow .rate{font:600 17px var(--font-display);font-variant-numeric:tabular-nums;color:var(--text)}
.hrow .rate small{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--faint);margin-left:4px}
.dots{display:flex;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.09)}
.dot.on{background:var(--green)}
.dot.off{background:none;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12)}
.dl{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted);margin-left:6px;text-transform:none}
.hrow .st{font-size:12.5px;color:var(--muted)}
.hrow .st b{color:var(--text);font:700 17px var(--font-display);margin-right:4px}
.foot{margin-top:28px;font-size:12px;color:var(--faint);display:grid;gap:10px;justify-items:start}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Tab-Leiste */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:14px 20px 18px;background:linear-gradient(to top,rgba(9,13,15,.92) 55%,rgba(9,13,15,0));pointer-events:none}
.tabs-in{pointer-events:auto;display:grid;grid-template-columns:1fr 1fr;gap:4px;width:100%;max-width:420px;background:rgba(24,33,38,.78);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--hair);border-radius:999px;padding:4px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.tab{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 0;border-radius:999px;border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.04em}
.tab[aria-current="page"]{background:rgba(255,255,255,.09);color:var(--text)}
.tab[aria-current="page"] svg{color:var(--teal)}

/* Neues Habit */
.sheet{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(3,6,8,.7);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet-body{position:relative;width:100%;max-width:480px;background:linear-gradient(180deg,#1b262c,#12191d);border:1px solid var(--hair);border-bottom:0;border-radius:28px 28px 0 0;padding:14px 20px 28px;display:grid;gap:16px}
.sgrab{display:grid;gap:14px;margin:-14px -20px 0;padding:14px 20px 4px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.sgrab:active{cursor:grabbing}
.sbar{justify-self:center;width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
.sheet-body{transition:transform .38s cubic-bezier(.22,1,.36,1)}
.sheet-body.dragging{transition:none}
.sheet-bg{transition:opacity .3s}
.sheet:not([hidden]) .sheet-body{animation:sup .4s cubic-bezier(.22,1,.36,1)}
.sheet:not([hidden]) .sheet-bg{animation:sbg .3s ease}
@keyframes sup{from{transform:translateY(100%)}}
@keyframes sbg{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet:not([hidden]) .sheet-body,.sheet:not([hidden]) .sheet-bg{animation:none}.sheet-body,.sheet-bg{transition:none}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:rgba(0,0,0,.28);border:1px solid var(--hair);border-radius:13px;margin-top:10px}
.seg button{height:38px;border-radius:9px;border:0;background:none;color:var(--muted);font:600 13px var(--font-display);letter-spacing:.04em;padding:0;transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.12);color:var(--text,#fff)}
.seg button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.every{display:flex;align-items:center;gap:10px;margin-top:10px}
.every[hidden]{display:none}
.every>span{color:var(--muted);font-size:15px;font-weight:600}
.every button{flex:none;width:46px;height:46px;border-radius:14px;border:1px solid var(--hair);background:rgba(255,255,255,.05);font-size:22px;padding:0}
.every button:active{transform:scale(.94)}
.every button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.every output{min-width:44px;text-align:center;font:700 28px var(--font-display);font-variant-numeric:tabular-nums}
.sheet-body h2{font:700 26px/1 var(--font-display);text-transform:uppercase;letter-spacing:.03em}
.sheet-body label{display:block;margin-bottom:7px}
.sheet-body input{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--hair);border-radius:14px;padding:13px 14px;outline-offset:0}
.sheet-body input:focus{border-color:var(--blue);outline:none}
.stepper{display:grid;grid-template-columns:48px 1fr 48px;gap:8px}
.stepper button{border-radius:14px;border:1px solid var(--hair);background:rgba(255,255,255,.05);font-size:22px}
.stepper input{text-align:center;font:600 22px var(--font-display)}
.hint{font-size:12.5px;color:var(--muted);margin-top:7px}
.when{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:rgba(0,0,0,.28);border:1px solid var(--hair);border-radius:14px;padding:10px 14px;min-height:52px}
.when:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.when .ci{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--muted);transition:background .2s,color .2s}
.when[aria-checked="false"] .ci{background:var(--teal);color:#03150e}
.when .wt{flex:1;font-size:15px;font-weight:600}
.when .wt small{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:2px}
.sw{flex:none;width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.14);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4);transition:transform .22s cubic-bezier(.3,1.4,.5,1)}
.when[aria-checked="true"] .sw{background:var(--teal)}
.when[aria-checked="true"] .sw::after{transform:translateX(18px)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.days[hidden]{display:none}
.days button{height:44px;border-radius:12px;border:1px solid var(--hair);background:rgba(255,255,255,.05);font:600 13px var(--font-display);letter-spacing:.02em;padding:0;transition:background .15s,color .15s,border-color .15s,transform .12s}
.days button:active{transform:scale(.94)}
.days button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#03150e}
.days button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hint.err{color:var(--red)}
.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:2px}
.actions button{padding:14px;border-radius:999px;font-size:14px;font-weight:600;letter-spacing:.03em;border:1px solid var(--hair);background:rgba(255,255,255,.05)}
.actions .primary{background:var(--teal);border-color:var(--teal);color:#03150e}

/* Pull-to-Refresh */
.ptr{position:fixed;top:14px;left:50%;width:46px;height:46px;margin-left:-23px;border-radius:50%;background:#131a1f;border:1px solid rgba(255,255,255,.13);box-shadow:0 8px 20px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07);display:grid;place-items:center;z-index:15;opacity:0;pointer-events:none;transform:translateY(-72px);will-change:transform,opacity;transition:opacity .25s ease,transform .5s cubic-bezier(.22,1,.36,1),scale .3s cubic-bezier(.3,1.5,.5,1)}
.ptr.pulling{transition:scale .3s cubic-bezier(.3,1.5,.5,1)}
.ptr.ready{scale:1.08}
.ptr.done{opacity:0!important;scale:.55;transition:opacity .28s ease,scale .35s cubic-bezier(.4,0,.2,1)}
.ptr .g{transform-box:fill-box;transform-origin:center;transition:opacity .2s}
.ptr .t{transition:opacity .2s}
.ptr .pl{fill:none;stroke:#03150e;stroke-width:2.6;stroke-linecap:round;opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.4) rotate(-90deg);transition:opacity .15s,transform .4s cubic-bezier(.3,1.6,.5,1)}
.ptr .pt{position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:600;font-size:11px;line-height:1;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);opacity:0;transition:opacity .2s}
.ptr.add{background:var(--teal);border-color:var(--teal);scale:1.12;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.ptr.add .t,.ptr.add .g{opacity:0}
.ptr.add .pl{opacity:1;transform:none}
.ptr.add .pt{opacity:1}
.ptr svg{width:26px;height:26px;display:block}
.ptr .t{fill:none;stroke:rgba(255,255,255,.1);stroke-width:3}
.ptr .a{fill:none;stroke:var(--blue);stroke-width:3;stroke-linecap:round;stroke-dasharray:0 100;transition:stroke .25s}
.ptr.ready .a{stroke:var(--teal)}
.ptr.busy svg{animation:spin .85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#app{transition:none}.ptr{transition:none}.ptr.busy svg{animation-duration:1.6s}}

/* Tagesfenster */
.dsheet{position:fixed;inset:0;z-index:20}
.dsheet[hidden]{display:none}
.dsheet-bg{position:absolute;inset:0;background:rgba(3,6,8,.66);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);opacity:var(--bgo,0)}
.dpanel{position:absolute;left:50%;bottom:0;width:100%;max-width:480px;height:100%;transform:translate(-50%,var(--ty,100%));transition:transform .32s cubic-bezier(.2,.8,.2,1);background:linear-gradient(180deg,#1d2a31,#0f1519);border:1px solid var(--hair);border-bottom:0;border-radius:28px 28px 0 0;display:flex;flex-direction:column;overflow:hidden;will-change:transform;box-shadow:0 -12px 40px rgba(0,0,0,.5)}
.dpanel.dragging{transition:none}
.dgrab{flex:none;padding:6px 20px 0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.dgrab:active{cursor:grabbing}
.dhandle{display:block;position:relative;width:100%;height:26px;background:none;border:0}
.dhandle::before{content:"";position:absolute;left:50%;top:10px;width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);transform:translateX(-50%);transition:background .15s}
.dhandle:hover::before{background:rgba(255,255,255,.4)}
.dhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:6px 0 14px}
.xclose{flex:none;align-self:flex-start;margin:-2px -6px 0 0;padding:8px;background:none;border:0;color:var(--muted);line-height:0}
.xclose:hover{color:var(--text)}
.dhead h2{font:700 24px/1.1 var(--font-display);text-transform:uppercase;letter-spacing:.02em}
.dbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 20px 90px}
.dpanel[data-snap="half"] .dbody{overflow:hidden}
.dbody .hero{padding-top:8px}
.dbody .hero-wrap{width:min(240px,66vw)}
.dbody .hero-pct{font-size:56px}
.dnote{margin:14px 4px 0;font-size:12.5px;color:var(--faint)}
.caltip{position:fixed;z-index:30;pointer-events:none;background:#0d1417;border:1px solid var(--hair);border-radius:14px;padding:10px 13px 11px;box-shadow:0 10px 30px rgba(0,0,0,.55);min-width:150px;max-width:260px}
.caltip[hidden]{display:none}
.caltip b{display:block;font:700 20px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.caltip .ct-date{display:block;font-size:11.5px;color:var(--muted);margin:2px 0 8px}
.ct-row{display:flex;align-items:center;gap:8px;font-size:12.5px;line-height:1.55}
.ct-row i{flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid rgba(255,255,255,.28)}
.ct-row i.on{background:var(--green);border-color:var(--green)}
.ct-row em{font-style:normal;color:var(--muted)}
.ct-row i.on + em{color:var(--text)}

.slide-l{animation:slideL .26s ease-out}
.slide-r{animation:slideR .26s ease-out}
@keyframes pop{0%{transform:scale(.7)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes slideL{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.slide-l,.slide-r,.chk.pop,.hero-wrap.pulse svg{animation:none}.dpanel{transition:none}.cell{transition:none}}
</style>

<script>
(function(){
  var DAYS=['Mo','Di','Mi','Do','Fr','Sa','So'];
  var KEY='habits-v1';
  try{localStorage.removeItem('habit-proto-v2');}catch(e){}   /* alte Beispieldaten entfernen */
  var COLORS={blue:['#0093e7','#5ccbff'],green:['#16ec06','#16ec06'],amber:['#ffde00','#ffde00'],red:['#ff0026','#ff0026'],rest:['#6f8089','#6f8089']};   /* WHOOP-Originalfarben: Recovery High/Medium/Low, Strain */
  var pad=function(n){return String(n).padStart(2,'0');};
  var key=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
  var parse=function(k){var p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
  var addDays=function(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;};
  var mondayOf=function(d){var x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
  var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  var $=function(s){return document.querySelector(s);};
  var fmt=function(d,o){return d.toLocaleDateString('de-DE',o);};
  var reduceMotion=function(){return window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;};

  var today=new Date();today.setHours(0,0,0,0);
  var todayKey=key(today);
  var oldest=addDays(today,-34);

  function seed(){return {habits:[],log:{},times:{}};}   /* Start ohne Beispieldaten */
  function load(){
    try{
      var raw=localStorage.getItem(KEY);
      if(raw){var s=JSON.parse(raw);if(s&&Array.isArray(s.habits)&&s.log){s.times=s.times||{};return s;}}
    }catch(e){}
    return seed();
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

  var state=load();
  var selected=todayKey;
  var tab='today';
  var section='habits';
  var editing=false;
  var heroMode='pct';
  var heroPrev=null;
  var popId=null;
  var slide=null;
  var animRaf=0;
  var gid=0;
  var chartData=[];

  function count(k,h){return (state.log[k]&&state.log[k][h.id])||0;}
  function isDone(h,k){return count(k,h)>=h.target;}
  /* Zeitplan: h.days = Wochentage (0=Mo … 6=So); fehlt das Feld, ist das Habit täglich */
  function wdOf(k){return (parse(k).getDay()+6)%7;}
  function sched(h,k){
    if(h.created&&k<h.created)return false;   /* vor dem Anlegen gab es das Habit noch nicht */
    if(h.every>1){   /* alle N Tage, gezählt ab dem Starttag */
      var df=Math.round((parse(k)-parse(h.start||todayKey))/864e5);
      return df>=0&&df%h.every===0;
    }
    return !h.days||h.days.indexOf(wdOf(k))>-1;
  }
  function isCustom(h){return h.every>1||(h.days&&h.days.length<7);}
  function habitsOn(k){return state.habits.filter(function(h){return sched(h,k);});}
  function total(k){return habitsOn(k).length;}
  function isRest(k){return total(k)===0;}
  function daysLabel(h){
    if(h.every>1)return 'Alle '+h.every+' Tage';
    if(!h.days||h.days.length===7)return 'Täglich';
    var d=h.days.slice().sort(function(a,b){return a-b;});
    if(d.join()==='0,1,2,3,4')return 'Mo–Fr';
    if(d.join()==='5,6')return 'Sa, So';
    return d.map(function(i){return DAYS[i];}).join(', ');
  }
  function doneCount(k){return habitsOn(k).filter(function(h){return isDone(h,k);}).length;}
  function frac(k){var n=total(k);return n?doneCount(k)/n:0;}
  function streak(h,k){
    var n=0,d=k?parse(k):new Date(today),guard=0;
    if(key(d)===todayKey&&sched(h,key(d))&&!isDone(h,key(d)))d=addDays(d,-1);
    while(guard++<400){
      var dk=key(d);
      if(sched(h,dk)){if(!isDone(h,dk))break;n++;}   /* freie Tage unterbrechen die Serie nicht */
      d=addDays(d,-1);
    }
    return n;
  }
  /* Tages-Serie: ab 5 geplanten Habits zählen 3 erledigte, darunter reichen 50 % (aufgerundet) */
  var DGOAL=3;
  function dayNeed(k){var n=total(k);return n?(n<5?Math.ceil(n/2):DGOAL):0;}
  function dayHit(k){var nd=dayNeed(k);return nd>0&&doneCount(k)>=nd;}
  function dayStreak(){
    var d=new Date(today),n=0,guard=0;
    if(dayNeed(key(d))>0&&!dayHit(key(d)))d=addDays(d,-1);   /* heute noch offen: Serie lebt bis Mitternacht */
    while(guard++<400){
      var dk=key(d);
      if(dayNeed(dk)>0){if(!dayHit(dk))break;n++;}   /* freie Tage unterbrechen nicht */
      d=addDays(d,-1);
    }
    return n;
  }
  function renderDStreak(){
    var el=$('#dstreak');if(!el)return;
    var n=dayStreak(),hit=dayHit(todayKey),nd=dayNeed(todayKey);
    $('#dsnum').textContent=n;
    el.className='dstreak'+(hit?' on':(n>0?' pend':''));
    var lbl=n+(n===1?' Tag':' Tage')+' Serie'+(nd?' · heute '+Math.min(doneCount(todayKey),nd)+' von '+nd:'');
    el.setAttribute('aria-label',lbl);el.title=lbl;
    el.hidden=section!=='habits';
  }
  function targetFor(k){
    var n=total(k);if(!n)return 0;
    var d=parse(k),s=0;
    for(var i=1;i<=7;i++)s+=doneCount(key(addDays(d,-i)));
    return Math.min(n,Math.max(1,Math.ceil(s/7)));
  }
  function zone(f){return f>=0.67?'green':(f>=0.34?'amber':'red');}
  function colorFor(f,k){if(isRest(k))return 'rest';return f>=1?'green':(k===todayKey?'blue':zone(f));}

  /* ---------- SVG-Bausteine ---------- */
  function ring(f,size,stroke,ck){
    var id='g'+(gid++),r=(size-stroke)/2,c=2*Math.PI*r,m=size/2,col=COLORS[ck];
    return '<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" aria-hidden="true">'
      +'<defs><linearGradient id="'+id+'" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="'+col[0]+'"/><stop offset="1" stop-color="'+col[1]+'"/></linearGradient></defs>'
      +'<circle class="track" cx="'+m+'" cy="'+m+'" r="'+r+'" stroke-width="'+stroke+'"/>'
      +'<circle class="bar" cx="'+m+'" cy="'+m+'" r="'+r+'" stroke-width="'+stroke+'" stroke="url(#'+id+')" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-f))+'" transform="rotate(-90 '+m+' '+m+')" style="opacity:'+(f>0?1:0)+'"/>'
      +'</svg>';
  }
  function heroRing(f,ck,tf){
    var S=264,m=S/2,N=60,r=103,stroke=9,c=2*Math.PI*r,col=COLORS[ck],i,a,ticks='';
    for(i=0;i<N;i++){
      a=i/N*2*Math.PI-Math.PI/2;
      ticks+='<line class="tick" x1="'+(m+124*Math.cos(a)).toFixed(2)+'" y1="'+(m+124*Math.sin(a)).toFixed(2)+'" x2="'+(m+128.5*Math.cos(a)).toFixed(2)+'" y2="'+(m+128.5*Math.sin(a)).toFixed(2)+'"/>';
    }
    var mark='';
    if(tf>0&&tf<1){
      a=tf*2*Math.PI-Math.PI/2;
      mark='<line class="mark" x1="'+(m+(r-9)*Math.cos(a)).toFixed(2)+'" y1="'+(m+(r-9)*Math.sin(a)).toFixed(2)+'" x2="'+(m+(r+9)*Math.cos(a)).toFixed(2)+'" y2="'+(m+(r+9)*Math.sin(a)).toFixed(2)+'"><title>Tagesziel</title></line>';
    }
    return '<svg viewBox="0 0 '+S+' '+S+'" aria-hidden="true">'
      +'<defs><linearGradient id="hg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="'+col[0]+'"/><stop offset="1" stop-color="'+col[1]+'"/></linearGradient></defs>'
      +ticks
      +'<circle class="track" cx="'+m+'" cy="'+m+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.075)" stroke-width="'+stroke+'"/>'
      +'<circle id="hbar" data-c="'+c+'" cx="'+m+'" cy="'+m+'" r="'+r+'" fill="none" stroke="url(#hg)" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-f))+'" transform="rotate(-90 '+m+' '+m+')"/>'
      +mark+'</svg>';
  }
  var EDIT_PEN='<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.6 3.9a1.9 1.9 0 0 1 2.7 0l1.8 1.8a1.9 1.9 0 0 1 0 2.7L8.9 19.6l-4.6 1.2 1.2-4.6z"/><path d="M14.2 5.3l4.5 4.5"/><path d="M13.5 21.2h7"/></svg>';
  var EDIT_OK='<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var CHECK='<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var TRASH='<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M9 7V4h6v3"/></svg>';
  var AIM='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>';

  /* ---------- Hero-Animation ---------- */
  function animateHero(from,to){
    var bar=$('#hbar');if(!bar)return;
    var C=parseFloat(bar.getAttribute('data-c')),ticks=document.querySelectorAll('.tick'),N=ticks.length,val=$('#hval'),mode=heroMode,wrap=$('.hero-wrap');
    function paint(f){
      bar.style.strokeDashoffset=C*(1-f);
      bar.style.opacity=f>0.002?1:0;
      for(var i=0;i<N;i++)ticks[i].classList.toggle('on',f>0&&i<f*N-0.001);
      if(mode==='pct'&&val)val.textContent=Math.round(f*100);
    }
    cancelAnimationFrame(animRaf);
    if(to>=1&&from<1&&wrap&&!reduceMotion())wrap.classList.add('pulse');
    if(reduceMotion()||from===to){paint(to);return;}
    var t0=null,dur=800;
    paint(from);
    function step(ts){
      if(t0===null)t0=ts;
      var p=Math.min((ts-t0)/dur,1),e=1-Math.pow(1-p,3);
      paint(from+(to-from)*e);
      if(p<1)animRaf=requestAnimationFrame(step);
    }
    animRaf=requestAnimationFrame(step);
    setTimeout(function(){paint(to);},dur+150);
  }

  /* ---------- Coach ---------- */
  function coachText(k){
    if(!state.habits.length)return 'Leg dein erstes Habit an. Dann berechne ich dir ein Tagesziel.';
    var n=total(k);
    if(!n)return k===todayKey?'Heute ist nichts geplant. Ruhetag.':'An diesem Tag war nichts geplant.';
    var d=doneCount(k),t=targetFor(k);
    if(k===todayKey){
      if(d>=n)return 'Alles erledigt. Mehr geht heute nicht.';
      if(d>=t)return 'Tagesziel erreicht. Alles darüber ist Bonus.';
      var open=habitsOn(k).filter(function(h){return !isDone(h,k);}).sort(function(a,b){return streak(b)-streak(a);})[0];
      var s=streak(open);
      return 'Noch <b>'+(t-d)+'</b> bis zum Ziel. '+(s>0?'<b>'+esc(open.name)+'</b> sichert deine Serie von '+s+' Tagen.':'Nächster Kandidat: <b>'+esc(open.name)+'</b>.');
    }
    return d>=t?'Ziel von '+t+' erreicht. Geschafft: '+d+'.':'Ziel von '+t+' verfehlt. Geschafft: '+d+'.';
  }

  /* ---------- Tag (Heute-Ansicht und Tagesfenster) ---------- */
  function row(h,k,edit){
    var c=count(k,h),done=c>=h.target,f=Math.min(c/h.target,1),st=streak(h,k);
    var tm=state.times[k]&&state.times[k][h.id];
    var meta=(h.target>1?(c+' von '+h.target):(done?'Erledigt':'Offen'))+(done&&tm?' · '+tm:'')+(isCustom(h)?' · '+daysLabel(h):'');
    var inner=done?CHECK:(h.target>1?'<span>'+c+'</span>':'');
    var ringHtml=done?'':ring(f,40,3.5,'blue');
    var sc=st>=7?'hi':(st>=3?'':(st>0?'lo':'zero'));
    var right=edit
      ?'<button class="del" type="button" data-del="'+h.id+'" aria-label="Habit entfernen: '+esc(h.name)+'">'+TRASH+'</button>'
      :'<div class="streak"><b class="'+sc+'">'+(st>0?st:'&ndash;')+'</b><i>Tage Serie</i></div>';
    return '<li class="row" data-hid="'+h.id+'">'
      +'<button class="row-main" type="button" data-toggle="'+h.id+'" data-k="'+k+'" aria-pressed="'+done+'" aria-label="'+esc(h.name)+': '+meta+'"'+(edit?' disabled':'')+'>'
      +'<span class="chk'+(done?' done':'')+(popId===h.id?' pop':'')+'">'+ringHtml+'<span class="mid">'+inner+'</span></span>'
      +'<span class="txt"><p class="name">'+esc(h.name)+'</p><p class="meta">'+meta+'</p></span>'
      +'</button>'+right+'</li>';
  }

  function dayParts(k,edit){
    var n=total(k),d=doneCount(k),t=targetFor(k),f=n?d/n:0,pct=Math.round(f*100),tf=0;
    var ck=colorFor(f,k),col=COLORS[ck];
    var from=(heroPrev&&heroPrev.k===k)?heroPrev.f:0;
    heroPrev={k:k,f:f};

    var val,sub;
    if(heroMode==='pct'){
      val='<span id="hval">'+(from===f?pct:Math.round(from*100))+'</span><small>%</small>';
      sub=n===0?(state.habits.length?(k===todayKey?'Heute nichts geplant':'Nichts geplant'):'Noch keine Habits'):(d<n?(d+' von '+n+' erledigt'):'Alles erledigt');
    }else{
      val='<span id="hval">'+d+'</span><small>/'+n+'</small>';
      sub=pct+' % erledigt';
    }

    var pace='';
    if(k===todayKey){
      var now=new Date(),tfDay=(now.getHours()*60+now.getMinutes())/1440;
      pace='<div class="pace" style="--pc:'+col[0]+'"><span class="label">Tag</span>'
        +'<div class="pace-bar" role="img" aria-label="Tagesverlauf: '+Math.round(tfDay*100)+' Prozent des Tages vorbei, '+pct+' Prozent erledigt"><i style="width:'+(f*100)+'%"></i><b style="left:'+(tfDay*100)+'%"></b></div>'
        +'<span class="pace-val">'+pad(now.getHours())+':'+pad(now.getMinutes())+'</span></div>';
    }

    var shown=edit?state.habits:habitsOn(k);
    var list=shown.length?shown.map(function(h){return row(h,k,edit);}).join(''):(state.habits.length?'<li class="empty">'+(k===todayKey?'Heute ist nichts geplant.':'An diesem Tag war nichts geplant.')+'</li>':'<li class="empty">Noch keine Habits. Leg unten dein erstes an.</li>');
    popId=null;
    return {
      n:n,from:from,to:f,
      hero:'<section class="hero"><div class="hero-wrap" style="--hc:'+col[0]+'">'+heroRing(from,ck,tf)
        +'<button class="hero-mid" type="button" data-hero aria-label="Erledigt. Anzeige umschalten: Prozent oder Anzahl">'
        +'<span class="label">Erledigt</span><span class="hero-pct">'+val+'</span><span class="hero-sub">'+sub+'</span></button>'
        +'</div></section>',
      coach:'<div class="card coach"><div class="coach-ic">'+AIM+'</div><div><p class="label">Coach</p><p class="coach-txt">'+coachText(k)+'</p></div></div>',
      pace:pace,
      list:list
    };
  }

  var pending=null;
  function todayView(){
    var p=dayParts(selected,editing);
    pending={from:p.from,to:p.to};
    var mon=mondayOf(parse(selected)),week='';
    for(var i=0;i<7;i++){
      var dd=addDays(mon,i),k=key(dd),off=dd>today||dd<oldest;
      var wf=off?0:frac(k);
      week+='<button class="day'+(k===selected?' sel':'')+(k===todayKey?' today':'')+'" type="button" data-day="'+k+'"'+(off?' disabled':'')
        +' aria-pressed="'+(k===selected)+'" aria-label="'+fmt(dd,{weekday:'long',day:'numeric',month:'long'})+'">'
        +'<span class="dn">'+DAYS[i]+'</span>'

      +'<ul class="card group">'+p.list+'</ul>'

  /* ---------- Verlauf ---------- */
  function chartHtml(){
    var W=336,H=150,L=30,T=12,B=26,pw=W-L-4,ph=H-T-B,N=14,slot=pw/N,bw=14,i;
    chartData=[];
    var svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="group" aria-label="Erledigte Habits der letzten 14 Tage in Prozent">';

      svg+='<line class="grid" x1="'+L+'" x2="'+(W-4)+'" y1="'+y+'" y2="'+y+'"/><text class="axis" x="'+(L-7)+'" y="'+(y+3)+'" text-anchor="end">'+v+'</text>';
    });
    var bars='',hits='',labels='',endLabel='';
    for(i=0;i<N;i++){
      var d=addDays(today,-(N-1-i)),k=key(d),f=frac(k),ck=colorFor(f,k),x=L+i*slot+(slot-bw)/2,h=Math.max(f*ph,2),y=T+ph-h,r=Math.min(4,h),isT=k===todayKey;
      bars+='<path d="M'+x+' '+(T+ph)+'V'+(y+r)+'Q'+x+' '+y+' '+(x+r)+' '+y+'H'+(x+bw-r)+'Q'+(x+bw)+' '+y+' '+(x+bw)+' '+(y+r)+'V'+(T+ph)+'Z" fill="'+COLORS[ck][0]+'"/>';
      var wd=DAYS[(d.getDay()+6)%7];
      labels+='<text class="axis'+(isT?' today':'')+'" x="'+(L+i*slot+slot/2)+'" y="'+(H-8)+'" text-anchor="middle">'+wd+'</text>';
      if(isT&&total(k))endLabel='<text class="val" x="'+(L+i*slot+slot/2)+'" y="'+(y-5)+'" text-anchor="middle">'+Math.round(f*100)+'</text>';
      chartData.push({
        cx:L+i*slot+slot/2,
        value:total(k)?doneCount(k)+' von '+total(k)+' · '+Math.round(f*100)+' %':(state.habits.length?'Nichts geplant':'Noch keine Habits'),

      });
      hits+='<rect class="hit" data-bar="'+i+'" tabindex="0" x="'+(L+i*slot)+'" y="0" width="'+slot+'" height="'+(H-2)+'" rx="6" aria-label="'+chartData[i].label+': '+chartData[i].value+'"/>';

  function historyView(){
    var i,k;
    var sum=0,sd=0;for(i=0;i<7;i++){k=key(addDays(today,-i));if(total(k)){sum+=frac(k);sd++;}}
    var avg=sd?Math.round(sum/sd*100):0;
    var perfect=0;for(i=0;i<30;i++){k=key(addDays(today,-i));if(total(k)&&doneCount(k)===total(k))perfect++;}
    var best=0;state.habits.forEach(function(h){best=Math.max(best,streak(h));});

    var start=mondayOf(addDays(today,-28)),cells='';
    DAYS.forEach(function(x){cells+='<span class="wd">'+x+'</span>';});
    for(i=0;i<35;i++){
      var d=addDays(start,i);k=key(d);
      if(d>today){cells+='<span class="cell future" aria-hidden="true">'+d.getDate()+'</span>';continue;}
      var f=frac(k),ck=colorFor(f,k);

    }

    var hl=state.habits.map(function(h){
      var dots='',on=0,j;
      for(j=6;j>=0;j--){var dk=key(addDays(today,-j)),sc=sched(h,dk),dn=sc&&isDone(h,dk);if(dn)on++;dots+='<span class="dot'+(dn?' on':(sc?'':' off'))+'"></span>';}
      var r30=0,s30=0;for(j=0;j<30;j++){var kk=key(addDays(today,-j));if(sched(h,kk)){s30++;if(isDone(h,kk))r30++;}}

        +'<div class="hrow-bot"><span class="dots" role="img" aria-label="Letzte 7 Tage: '+on+' erledigt">'+dots+'</span>'
        +'<span class="st"><b>'+st+'</b>Tage Serie</span></div></li>';
    }).join('');

    return '<div class="stats">'
      +'<div class="card tile"><b>'+avg+'<small>%</small></b><span class="label">Quote 7 Tage</span></div>'
      +'<div class="card tile"><b>'+perfect+'</b><span class="label">Perfekte Tage</span></div>'

      +'</div>'

      +'<span><i style="background:var(--amber)"></i>34–66 %</span>'
      +'<span><i style="background:var(--red)"></i>0–33 %</span>'
      +'<span><i style="background:var(--blue)"></i>Heute, läuft noch</span>'
      +'<span><i class="line"></i>Ziel heute</span></div>'
      +'<section class="card panel"><div class="panel-head"><span class="label">Letzte 14 Tage</span><span class="r">Erledigt in %</span></div>'
      +'<div class="chartwrap">'+chartHtml()+'<div class="tip" id="tip" hidden></div></div></section>'
      +'<section class="card panel"><div class="panel-head"><span class="label">Kalender</span><span class="r">Tag antippen für Details</span></div><div class="cal">'+cells+'</div></section>'
      +'<div class="sec"><span class="label">Pro Habit</span><span class="r">Quote der letzten 30 Tage</span></div>'
      +'<ul class="card group">'+(hl||'<li class="empty">Noch keine Habits.</li>')+'</ul>'
      +'<div class="foot"><p>Alles bleibt nur in diesem Browser gespeichert.</p></div>';
  }

  /* ---------- Render ---------- */
  function render(){
    var sd=parse(selected),isToday=selected===todayKey,view=$('#view');
    pending=null;

    document.querySelectorAll('.dr-item').forEach(function(b){if(b.dataset.sec===section)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});

      view.classList.remove('slide-l','slide-r');slide=null;

    clearTimeout(RO.timer);
    if(RO.row&&!RO.drag)RO.row.classList.remove('arming');
    if(!RO.drag)RO.row=null;
  }
  function roStart(){
    var row=RO.row;
    if(!row||!document.body.contains(row)){roCancel();return;}
    var ul=row.parentNode;
    var rows=[].slice.call(ul.children).filter(function(li){return li.dataset&&li.dataset.hid;});
    row.classList.remove('arming');
    if(rows.length<2){RO.row=null;return;}
    var sy=window.scrollY||0;
    var rects=rows.map(function(r){return r.getBoundingClientRect();});
    var idx=rows.indexOf(row);
    RO.drag={ul:ul,row:row,rows:rows,from:idx,to:idx,sy0:sy,y:RO.y0,
             tops:rects.map(function(r){return r.top+sy;}),hs:rects.map(function(r){return r.height;})};
    row.classList.add('lifting');
    rows.forEach(function(r){if(r!==row)r.classList.add('shifty');});
    ul.classList.add('reordering');
    vib(14);
    roTick();
  }
  function roUpdate(){
    var d=RO.drag;if(!d)return;
    var n=d.rows.length,h=d.hs[d.from];
    var dy=(d.y-RO.y0)+((window.scrollY||0)-d.sy0);
    var lo=d.tops[0]-d.tops[d.from],hi=d.tops[n-1]+d.hs[n-1]-h-d.tops[d.from];
    dy=Math.max(lo,Math.min(hi,dy));
    d.dy=dy;
    d.row.style.transform='translateY('+dy+'px) scale(1.02)';
    var c=d.tops[d.from]+h/2+dy,to=0,i;
    for(i=0;i<n;i++){if(i!==d.from&&d.tops[i]+d.hs[i]/2<c)to++;}
    if(to!==d.to){d.to=to;vib(6);}
    for(i=0;i<n;i++){
      if(i===d.from)continue;
      var sh=0;
      if(d.from<d.to&&i>d.from&&i<=d.to)sh=-h;
      else if(d.from>d.to&&i>=d.to&&i<d.from)sh=h;
      d.rows[i].style.transform=sh?'translateY('+sh+'px)':'';
    }
  }
  function roTick(){
    var d=RO.drag;if(!d)return;
    var vh=window.innerHeight,step=0;
    if(d.y<90)step=-Math.min(14,(90-d.y)/6);
    else if(d.y>vh-130)step=Math.min(14,(d.y-(vh-130))/6);
    if(step){window.scrollBy(0,step);}
    roUpdate();
    RO.raf=requestAnimationFrame(roTick);
  }
  function roEnd(){
    clearTimeout(RO.timer);
    var d=RO.drag;
    if(!d){roCancel();return;}
    cancelAnimationFrame(RO.raf);
    RO.drag=null;RO.row=null;RO.last=Date.now();
    var n=d.rows.length,h=d.hs[d.from];
    var slotTop=d.to>d.from?d.tops[d.to]+d.hs[d.to]-h:d.tops[d.to];
    d.row.classList.add('settling');
    d.row.style.transform='translateY('+(slotTop-d.tops[d.from])+'px)';
    setTimeout(function(){
      if(d.to!==d.from){
        var ids=d.rows.map(function(r){return r.dataset.hid;});
        var mv=ids.splice(d.from,1)[0];ids.splice(d.to,0,mv);
        var by={},slots=[];
        state.habits.forEach(function(x,i){by[x.id]=x;if(ids.indexOf(x.id)>-1)slots.push(i);});
        slots.forEach(function(si,j){state.habits[si]=by[ids[j]];});
        save();
      }
      popId=null;render();
    },240);
  }
  document.addEventListener('pointerdown',function(e){
    if(RO.drag||editing||(e.pointerType==='mouse'&&e.button!==0))return;
    var row=e.target.closest&&e.target.closest('#view .row');
    if(!row||!row.dataset.hid)return;
    var r=row.getBoundingClientRect();
    if(e.clientX<r.left+r.width*0.68)return;   /* nur die rechte Seite */
    RO.row=row;RO.x0=e.clientX;RO.y0=e.clientY;RO.id=e.pointerId;
    row.classList.add('arming');
    clearTimeout(RO.timer);RO.timer=setTimeout(roStart,HOLD);
  });
  document.addEventListener('pointermove',function(e){
    if(e.pointerId!==RO.id)return;
    if(RO.drag){RO.drag.y=e.clientY;return;}
    if(RO.row&&Math.hypot(e.clientX-RO.x0,e.clientY-RO.y0)>10)roCancel();
  });
  document.addEventListener('pointerup',function(e){if(e.pointerId===RO.id)roEnd();});
  document.addEventListener('pointercancel',function(e){if(e.pointerId===RO.id)roEnd();});
  document.addEventListener('touchmove',function(e){if(RO.drag&&e.cancelable)e.preventDefault();},{passive:false});
  document.addEventListener('contextmenu',function(e){if(e.target.closest&&e.target.closest('#view .row'))e.preventDefault();});
  document.addEventListener('click',function(e){   /* Loslassen nach dem Verschieben soll nichts abhaken */
    if(Date.now()-RO.last<600&&e.target.closest&&e.target.closest('.row')){e.stopPropagation();e.preventDefault();}
  },true);

  /* ---------- Nach unten ziehen zum Neuladen ---------- */
  var P={on:false,act:false,y0:0,x0:0,d:0,busy:false,hit:false,hitA:false,TH:56,ADD:112,zone:false,armed:false,zt:0};
  function addOk(){return section==='habits'&&tab==='today'&&!editing;}
  var ptrEl=$('#ptr'),appEl=$('#app'),ptrG=$('#ptrg'),ptrA=$('#ptra');
  function pullTo(d){
    P.d=d;
    var p=Math.min(1,d/P.TH);
    appEl.style.transform='translateY('+d+'px)';
    ptrEl.style.opacity=Math.min(1,d/26);
    ptrEl.style.transform='translateY('+(d-58)+'px)';
    var p2=addOk()?Math.max(0,Math.min(1,(d-P.TH)/(P.ADD-P.TH))):0;   /* 0..1 zwischen Neuladen und Hinzufügen */
    ptrG.style.transform='rotate('+(p*270+p2*90)+'deg)';
    ptrA.style.strokeDasharray=(p*44+p2*18.8)+' 100';
    var rd=d>=P.TH,ad=addOk()&&d>=P.ADD;
    ptrEl.classList.toggle('ready',rd);
    /* Hinzufügen erst, wenn man weit gezogen hat UND kurz dort bleibt */
    if(ad&&!P.zone){P.zone=true;clearTimeout(P.zt);P.zt=setTimeout(function(){P.armed=true;ptrEl.classList.add('add');try{if(navigator.vibrate)navigator.vibrate([10,30,10]);}catch(e){}},450);}
    if(!ad&&P.zone){P.zone=false;clearTimeout(P.zt);P.armed=false;ptrEl.classList.remove('add');}
    if(rd&&!P.hit){P.hit=true;try{if(navigator.vibrate)navigator.vibrate(6);}catch(e){}}
    if(!rd)P.hit=false;
  }
  function pullReset(){
    appEl.classList.remove('pulling');ptrEl.classList.remove('pulling');
    appEl.style.transform='';ptrEl.style.opacity='';ptrEl.style.transform='';
    ptrG.style.transform='';ptrA.style.strokeDasharray='';
    ptrEl.classList.remove('ready','busy','done','add');
    clearTimeout(P.zt);P.zone=false;P.armed=false;
    P.hit=false;
  }
  function refresh(){
    today=new Date();today.setHours(0,0,0,0);todayKey=key(today);oldest=addDays(today,-34);
    state=load();
    if(parse(selected)>today)selected=todayKey;
    heroPrev=null;
    render();renderSheet();
  }
  function pullEnd(){
    if(!P.on&&!P.act)return;
    var go=P.act&&P.d>=P.TH;
    var add=P.act&&addOk()&&P.armed&&P.d>=P.ADD;
    P.on=false;P.act=false;
    if(add){
      /* langer Zug: wie „zur Warteschlange hinzufügen“ – Anzeige gleitet weg, Hinzufügen-Fenster öffnet */
      P.busy=true;
      appEl.classList.remove('pulling');ptrEl.classList.remove('pulling');
      ptrEl.classList.add('done');
      appEl.style.transform='';ptrEl.style.transform='translateY(-58px)';
      setTimeout(openSheet,160);
      setTimeout(function(){pullReset();P.busy=false;},560);
      return;
    }
    if(!go){
      /* weich zurückfedern: Ring zieht sich ein, Seite gleitet hoch */
      appEl.classList.remove('pulling');ptrEl.classList.remove('pulling');
      ptrEl.classList.add('done');
      appEl.style.transform='';ptrEl.style.transform='translateY(-58px)';
      P.busy=true;
      setTimeout(function(){pullReset();P.busy=false;},520);
      return;
    }
    P.busy=true;
    appEl.classList.remove('pulling');ptrEl.classList.remove('pulling');
    appEl.style.transform='translateY('+P.TH+'px)';
    ptrEl.style.opacity='1';ptrEl.style.transform='translateY('+(P.TH-58)+'px)';
    ptrG.style.transform='rotate(270deg)';ptrA.style.strokeDasharray='44 100';
    ptrEl.classList.add('busy');
    try{if(navigator.vibrate)navigator.vibrate(8);}catch(e){}
    setTimeout(function(){
      refresh();                       /* Inhalt neu, während der Ring noch dreht */
      ptrEl.classList.add('done');     /* Ring blendet aus … */
      appEl.style.transform='';        /* … und die Seite gleitet zurück */
      ptrEl.style.transform='translateY(-58px)';
      setTimeout(function(){pullReset();P.busy=false;},540);
    },900);
  }
  document.addEventListener('touchstart',function(e){
    P.on=false;
    if(P.busy||D.open||!$('#sheet').hidden||!$('#drawer').hidden||e.touches.length!==1)return;
    if((window.scrollY||document.documentElement.scrollTop)>0)return;
    P.on=true;P.act=false;P.y0=e.touches[0].clientY;P.x0=e.touches[0].clientX;
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(RO.row||RO.drag){P.on=false;return;}
    if(!P.on)return;
    var t=e.touches[0],dy=t.clientY-P.y0,dx=t.clientX-P.x0;
    if(!P.act){
      if(Math.abs(dx)>Math.abs(dy)||dy<-4){P.on=false;return;}
      if(dy<12)return;
      if((window.scrollY||document.documentElement.scrollTop)>0){P.on=false;return;}
      P.act=true;appEl.classList.add('pulling');ptrEl.classList.add('pulling');
    }
    if(e.cancelable)e.preventDefault();
    var raw=Math.max(0,dy-12);
    pullTo(addOk()
      ?Math.min(150,raw<=100?96*(1-Math.exp(-raw/100)):96*(1-Math.exp(-1))+(raw-100)*0.3)   /* ab dem Neuladen-Punkt deutlich zäher */
      :96*(1-Math.exp(-raw/100)));   /* Gummiband-Widerstand */
  },{passive:false});
  document.addEventListener('touchend',pullEnd);
  document.addEventListener('touchcancel',pullEnd);

  render();
})();
</script>
<script>
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
</script>
